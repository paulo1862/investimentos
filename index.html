<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Financeiro - Vader</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #ecf0f1; --secondary: #18bc9c; --card-bg: rgba(30, 40, 50, 0.95); --text: #bdc3c7; --border-color: #455a64; --accent: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background-image: url('vader_fundo.jpg'); background-color: #1a1a1a; background-size: cover; background-position: center top; background-attachment: fixed; color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* HEADER E BARRA DE SINCRONIZAÇÃO */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .sync-tools { display: flex; gap: 10px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; font-size: 0.85rem; text-transform: uppercase; }
        .btn-sync { background-color: #27ae60; }
        .btn-load { background-color: #f39c12; }
        .btn-danger { background-color: var(--accent); }
        .btn-tab { background: rgba(0,0,0,0.6); color: var(--text); border: 1px solid var(--border-color); padding: 12px 25px; cursor: pointer; font-weight: bold; }
        .btn-tab.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* CARDS E GRIDS */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .metric-label { font-size: 0.85rem; color: #95a5a6; text-transform: uppercase; margin-bottom: 5px; }
        .metric-value { font-size: 2rem; font-weight: bold; color: var(--primary); }
        
        /* TABELAS */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--secondary); text-transform: uppercase; font-size: 0.75rem; }

        /* INPUTS */
        .form-control { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-color); color: #fff; border-radius: 5px; box-sizing: border-box; }
        
        /* LOGIN */
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('vader_fundo.jpg'); background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 10px; text-align: center; border: 1px solid var(--accent); width: 320px; }
    </style>
</head>
<body>

<div id="telaLogin" class="login-screen">
    <div class="login-box">
        <img src="vader_sabre.jpg" style="width: 100px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 20px;">
        <h2 style="color: var(--accent); letter-spacing: 2px;">COMANDO SITH</h2>
        <input type="password" id="senhaInput" class="form-control" placeholder="Credencial" style="text-align: center;">
        <button class="btn btn-danger" style="width: 100%; font-size: 1.1rem;" onclick="verificarSenha()">ACESSAR</button>
    </div>
</div>

<div id="conteudoSistema" style="display: none;">
    <div class="container">
        <div class="header">
            <div>
                <h1 style="margin:0;">IMPÉRIO FINANCEIRO</h1>
                <div style="color: var(--secondary); font-weight: bold; margin-top:5px;">Sincronização Ativa</div>
            </div>
            <div class="sync-tools">
                <button class="btn btn-sync" onclick="exportarBackup()">💾 Salvar (PC)</button>
                <label class="btn btn-load">
                    📂 Carregar (Celular)
                    <input type="file" accept=".json" style="display: none;" onchange="importarBackup(event)">
                </label>
                <button class="btn" style="background: #555;" onclick="sair()">Sair</button>
            </div>
        </div>

        <div style="margin-bottom: 30px; display: flex; gap: 2px;">
            <button id="t1" class="btn-tab active" onclick="mudarAba('dashboard')">📊 DASHBOARD</button>
            <button id="t2" class="btn-tab" onclick="mudarAba('bancos')">⚙️ GESTÃO</button>
        </div>

        <div id="dashboard">
            <div class="grid-3">
                <div class="card">
                    <div class="metric-label">Patrimônio Total</div>
                    <div class="metric-value" id="totalAtual">R$ 0,00</div>
                </div>
                <div class="card">
                    <div class="metric-label">Lucro Estimado</div>
                    <div class="metric-value" id="lucroMes" style="color: var(--secondary);">R$ 0,00</div>
                </div>
                <div class="card">
                    <div class="metric-label">Rentabilidade</div>
                    <div class="metric-value" id="rentMes">0.00%</div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                <div class="card">
                    <h3 style="margin-top:0;">Performance por Banco</h3>
                    <table id="tabResumo">
                        <thead><tr><th>Banco</th><th>Saldo Atual</th><th>Rent. %</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="card" style="text-align: center;">
                    <h3 style="margin-top:0;">Alocação</h3>
                    <div style="height: 200px;"><canvas id="graficoAlocacao"></canvas></div>
                </div>
            </div>
        </div>

        <div id="bancos" style="display: none;">
            <div class="grid-3">
                <div class="card">
                    <h3 style="margin-top:0;">Cadastrar Banco</h3>
                    <input type="text" id="nNome" class="form-control" placeholder="Nome do Banco">
                    <input type="number" id="nSaldo" class="form-control" placeholder="Saldo Inicial (R$)">
                    <button class="btn btn-sync" style="width: 100%;" onclick="addBanco()">+ Adicionar</button>
                </div>
                <div id="listaBancos" style="grid-column: span 2;">
                    </div>
            </div>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('vaderDB')) || { bancos: [] };
    let chartObj = null;

    function verificarSenha() {
        const pass = document.getElementById('senhaInput').value;
        const savedPass = localStorage.getItem('vaderPass') || "Sith2026";
        if(pass === savedPass) {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('conteudoSistema').style.display = 'block';
            render();
        } else { alert("Acesso Negado."); }
    }

    function mudarAba(id) {
        document.getElementById('dashboard').style.display = id === 'dashboard' ? 'block' : 'none';
        document.getElementById('bancos').style.display = id === 'bancos' ? 'block' : 'none';
        document.getElementById('t1').classList.toggle('active', id === 'dashboard');
        document.getElementById('t2').classList.toggle('active', id === 'bancos');
        if(id === 'dashboard') render();
    }

    function addBanco() {
        const nome = document.getElementById('nNome').value;
        const saldo = parseFloat(document.getElementById('nSaldo').value) || 0;
        if(nome) {
            db.bancos.push({ nome, saldoInicial: saldo, saldoAtual: saldo });
            salvar();
            document.getElementById('nNome').value = '';
            document.getElementById('nSaldo').value = '';
            alert("Banco cadastrado!");
        }
    }

    function atualizarSaldo(idx, valor) {
        db.bancos[idx].saldoAtual += valor;
        salvar();
    }

    function salvar() {
        localStorage.setItem('vaderDB', JSON.stringify(db));
        render();
    }

    function render() {
        const bodyRes = document.querySelector('#tabResumo tbody');
        const lista = document.getElementById('listaBancos');
        bodyRes.innerHTML = ''; lista.innerHTML = '';
        
        let total = 0; let totalInicial = 0;
        let labels = []; let valores = [];

        db.bancos.forEach((b, i) => {
            total += b.saldoAtual;
            totalInicial += b.saldoInicial;
            labels.push(b.nome);
            valores.push(b.saldoAtual);

            let lucro = b.saldoAtual - b.saldoInicial;
            let perc = b.saldoInicial > 0 ? (lucro / b.saldoInicial * 100).toFixed(2) : 0;

            bodyRes.innerHTML += `<tr><td><strong>${b.nome}</strong></td><td>R$ ${b.saldoAtual.toLocaleString()}</td><td>${perc}%</td></tr>`;
            
            lista.innerHTML += `
                <div class="card" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <div><strong>${b.nome}</strong><br><small>Saldo: R$ ${b.saldoAtual.toLocaleString()}</small></div>
                    <div>
                        <input type="number" id="v-${i}" class="form-control" style="width: 80px; display:inline; margin:0 5px;" placeholder="R$">
                        <button class="btn btn-sync" onclick="atualizarSaldo(${i}, parseFloat(document.getElementById('v-${i}').value))">+</button>
                        <button class="btn btn-danger" onclick="atualizarSaldo(${i}, -parseFloat(document.getElementById('v-${i}').value))">-</button>
                    </div>
                </div>`;
        });

        document.getElementById('totalAtual').innerText = `R$ ${total.toLocaleString()}`;
        document.getElementById('lucroMes').innerText = `R$ ${(total - totalInicial).toLocaleString()}`;
        let rentGlobal = totalInicial > 0 ? ((total - totalInicial) / totalInicial * 100).toFixed(2) : 0;
        document.getElementById('rentMes').innerText = `${rentGlobal}%`;

        desenharGrafico(labels, valores);
    }

    function desenharGrafico(labels, valores) {
        const ctx = document.getElementById('graficoAlocacao').getContext('2d');
        if(chartObj) chartObj.destroy();
        chartObj = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: valores, backgroundColor: ['#18bc9c','#3498db','#f39c12','#e74c3c','#9b59b6'], borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#bdc3c7' } } } }
        });
    }

    function exportarBackup() {
        const data = { db: db, pass: localStorage.getItem('vaderPass') || "Sith2026" };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup_vader.json';
        a.click();
    }

    function importarBackup(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = JSON.parse(event.target.result);
            db = data.db;
            localStorage.setItem('vaderPass', data.pass);
            salvar();
            alert("Dados Importados com Sucesso!");
        };
        reader.readAsText(e.target.files[0]);
    }

    function sair() { location.reload(); }
</script>
</body>
</html>
