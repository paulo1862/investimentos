<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Império Financeiro - Vader</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #ecf0f1; --secondary: #18bc9c; --card-bg: rgba(30, 40, 50, 0.95); --text: #bdc3c7; --border-color: #455a64; }
        body { font-family: 'Segoe UI', sans-serif; background-image: url('vader_fundo.jpg'); background-color: #1a1a1a; background-size: cover; background-position: center top; background-attachment: fixed; color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .sync-bar { background: #2c3e50; padding: 10px; border-radius: 8px; display: flex; gap: 10px; margin-bottom: 20px; border: 1px solid #3498db; align-items: center; justify-content: center; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; font-size: 0.9rem; }
        .btn-sync { background-color: #27ae60; box-shadow: 0 0 10px rgba(39, 174, 96, 0.4); }
        .btn-load { background-color: #f39c12; }
        .btn-danger { background-color: #c0392b; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #222; padding: 40px; border-radius: 8px; text-align: center; border: 1px solid #e74c3c; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .form-control { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
        .tab-btn { padding: 10px 20px; background: #333; color: #fff; border: none; cursor: pointer; }
        .tab-btn.active { background: var(--secondary); }
    </style>
</head>
<body>

<div id="telaLogin" class="login-screen">
    <div class="login-box">
        <h2 style="color: #e74c3c;">COMANDO SITH</h2>
        <input type="password" id="senhaInput" class="form-control" placeholder="Senha">
        <button class="btn btn-danger" style="width: 100%" onclick="verificarSenha()">ENTRAR</button>
    </div>
</div>

<div id="conteudoSistema" style="display: none;">
    <div class="container">
        <div class="header">
            <h1>IMPÉRIO FINANCEIRO</h1>
            <div>
                <button class="btn" style="background: #555;" onclick="abrirModalSenha()">🔑 Senha</button>
                <button class="btn" style="background: #c0392b;" onclick="sair()">🚪 Sair</button>
            </div>
        </div>

        <div class="sync-bar">
            <span style="color: #3498db; font-weight: bold;">SINCRO:</span>
            <button class="btn btn-sync" onclick="exportarBackup()">💾 SALVAR DADOS (PC)</button>
            <label class="btn btn-load">
                📂 CARREGAR DADOS (CELULAR)
                <input type="file" accept=".json" style="display: none;" onchange="importarBackup(event)">
            </label>
        </div>

        <div style="margin-bottom: 20px;">
            <button id="t1" class="tab-btn active" onclick="aba('dashboard')">RESUMO</button>
            <button id="t2" class="tab-btn" onclick="aba('bancos')">BANCOS/LANÇAMENTOS</button>
        </div>

        <div id="dashboard">
            <div class="grid-3">
                <div class="card">
                    <div style="color: #95a5a6;">PATRIMÔNIO ATUAL</div>
                    <div class="metric-value" id="totalAtual">R$ 0,00</div>
                </div>
                <div class="card">
                    <div style="color: #95a5a6;">LUCRO NO MÊS</div>
                    <div class="metric-value" id="lucroMes" style="color: #27ae60;">R$ 0,00</div>
                </div>
                <div class="card">
                    <div style="color: #95a5a6;">RENTABILIDADE</div>
                    <div class="metric-value" id="rentMes">0.00%</div>
                </div>
            </div>
            <div class="card">
                <h3>Minha Carteira</h3>
                <table id="tabResumo">
                    <thead><tr><th>Banco</th><th>Saldo</th><th>Rent. %</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="bancos" style="display: none;">
            <div class="card">
                <h3>Novo Banco</h3>
                <input type="text" id="nNome" class="form-control" placeholder="Nome (Ex: Itaú)">
                <input type="number" id="nSaldo" class="form-control" placeholder="Saldo Inicial">
                <button class="btn btn-sync" onclick="addBanco()">Adicionar</button>
            </div>
            <div id="listaBancos"></div>
        </div>
    </div>
</div>

<div id="modalSenha" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center;">
    <div class="login-box">
        <h3>Nova Senha</h3>
        <input type="password" id="novaSenha" class="form-control">
        <button class="btn btn-sync" onclick="salvarSenha()">Salvar</button>
        <button class="btn btn-danger" onclick="document.getElementById('modalSenha').style.display='none'">Fechar</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('vaderDB')) || { bancos: [] };

    function verificarSenha() {
        const pass = document.getElementById('senhaInput').value;
        const savedPass = localStorage.getItem('vaderPass') || "Sith2026";
        if(pass === savedPass) {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('conteudoSistema').style.display = 'block';
            render();
        } else { alert("Acesso Negado."); }
    }

    function sair() { location.reload(); }

    function aba(id) {
        document.getElementById('dashboard').style.display = id === 'dashboard' ? 'block' : 'none';
        document.getElementById('bancos').style.display = id === 'bancos' ? 'block' : 'none';
        document.getElementById('t1').classList.toggle('active', id === 'dashboard');
        document.getElementById('t2').classList.toggle('active', id === 'bancos');
    }

    function addBanco() {
        const nome = document.getElementById('nNome').value;
        const saldo = parseFloat(document.getElementById('nSaldo').value) || 0;
        if(nome) {
            db.bancos.push({ nome, saldoInicial: saldo, saldoAtual: saldo });
            save();
            document.getElementById('nNome').value = '';
            document.getElementById('nSaldo').value = '';
        }
    }

    function registrar(idx, valor) {
        db.bancos[idx].saldoAtual += valor;
        save();
    }

    function save() {
        localStorage.setItem('vaderDB', JSON.stringify(db));
        render();
    }

    function render() {
        const bodyRes = document.querySelector('#tabResumo tbody');
        const lista = document.getElementById('listaBancos');
        bodyRes.innerHTML = '';
        lista.innerHTML = '';
        let total = 0;
        let totalInicial = 0;

        db.bancos.forEach((b, i) => {
            total += b.saldoAtual;
            totalInicial += b.saldoInicial;
            let lucro = b.saldoAtual - b.saldoInicial;
            let perc = b.saldoInicial > 0 ? (lucro / b.saldoInicial * 100).toFixed(2) : 0;

            bodyRes.innerHTML += `<tr><td>${b.nome}</td><td>R$ ${b.saldoAtual.toFixed(2)}</td><td>${perc}%</td></tr>`;
            
            lista.innerHTML += `
                <div class="card">
                    <h4>${b.nome}</h4>
                    <p>Saldo: R$ ${b.saldoAtual.toFixed(2)}</p>
                    <input type="number" id="val-${i}" class="form-control" style="width: 100px; display:inline;" placeholder="Valor">
                    <button class="btn btn-sync" onclick="registrar(${i}, parseFloat(document.getElementById('val-${i}').value))">Aportar (+)</button>
                    <button class="btn btn-danger" onclick="registrar(${i}, -parseFloat(document.getElementById('val-${i}').value))">Sacar (-)</button>
                </div>`;
        });

        document.getElementById('totalAtual').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('lucroMes').innerText = `R$ ${(total - totalInicial).toFixed(2)}`;
        let rentGlobal = totalInicial > 0 ? ((total - totalInicial) / totalInicial * 100).toFixed(2) : 0;
        document.getElementById('rentMes').innerText = `${rentGlobal}%`;
    }

    function exportarBackup() {
        const data = { db: db, pass: localStorage.getItem('vaderPass') || "Sith2026" };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vader_finance.json';
        a.click();
    }

    function importarBackup(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const importado = JSON.parse(event.target.result);
            db = importado.db;
            localStorage.setItem('vaderPass', importado.pass);
            save();
            alert("Dados Sincronizados!");
        };
        reader.readAsText(file);
    }

    function abrirModalSenha() { document.getElementById('modalSenha').style.display='flex'; }
    function salvarSenha() {
        const s = document.getElementById('novaSenha').value;
        if(s) { localStorage.setItem('vaderPass', s); alert("Senha alterada!"); document.getElementById('modalSenha').style.display='none'; }
    }
</script>
</body>
</html>
